
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Next Level Grooming Lounge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#101010;
  color:#fff;
  font-family:Arial,sans-serif
}
.container{
  width:100%;
  max-width:430px;
  padding:30px;
  background:#1b1b1b;
  border:1px solid #b58b36;
  border-radius:14px
}
h1{text-align:center;color:#d5ad58;font-size:25px}
.subtitle{text-align:center;color:#bbb;margin-bottom:25px}
label{display:block;margin:14px 0 7px}
input{
  width:100%;padding:13px;
  border:1px solid #555;border-radius:7px;
  background:#292929;color:white;font-size:16px
}
button{
  width:100%;padding:14px;margin-top:22px;
  background:#c49a45;color:#111;
  border:0;border-radius:7px;
  font-size:16px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
a{color:#d5ad58}
.links{text-align:center;margin-top:20px;color:#bbb}
#message{margin-top:17px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="container">
  <h1>Next Level Grooming Lounge</h1>
  <p class="subtitle">Confidence Starts Here</p>

  <h2>Create Your Account</h2>

  <form id="registerForm">
    <label for="fullName">Full name</label>
    <input id="fullName" type="text" required
      autocomplete="name" placeholder="Your full name">

    <label for="phone">Phone number</label>
    <input id="phone" type="tel" required
      autocomplete="tel" placeholder="e.g. 0712345678">

    <label for="email">Email address</label>
    <input id="email" type="email" required
      autocomplete="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" type="password" required
      minlength="8" autocomplete="new-password"
      placeholder="At least 8 characters">

    <button id="registerButton" type="submit">
      CREATE ACCOUNT
    </button>
  </form>

  <div id="message" role="status"></div>

  <div class="links">
    Already have an account?
    <a href="login.html">Log in</a>
    <br><br>
    <a href="index.html">Back to Home</a>
  </div>
</div>

<script>
const SUPABASE_URL = "https://teimbezoinfqlrxczafj.supabase.co";
const SUPABASE_KEY = "sb_publishable_3lJOm65rVFwElFqLN-Gxzw_LdYacHZP";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const fullName = document.getElementById("fullName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (password.length < 8) {
    message.textContent = "Your password must have at least 8 characters.";
    return;
  }

  button.disabled = true;
  button.textContent = "CREATING ACCOUNT...";
  message.textContent = "";

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: fullName,
          phone: phone
        }
      }
    });

    if (error) throw error;

    if (data.session) {
      message.textContent =
        "Your account has been created successfully. You can now log in.";
    } else {
      message.textContent =
        "Registration successful! Please check your email and confirm your account before logging in.";
    }

    form.reset();

  } catch (error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = "CREATE ACCOUNT";
  }
});
</script>
</body>
</html>
