
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment | Next Level Grooming Lounge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;min-height:100vh;
 background:#101010;color:white;
 font-family:Arial,sans-serif
}
.container{max-width:600px;margin:25px auto}
.card{
 background:#1b1b1b;border:1px solid #b58b36;
 border-radius:14px;padding:25px
}
h1,h2{color:#d5ad58}
h1{text-align:center;font-size:26px}
.subtitle{text-align:center;color:#bbb;margin-bottom:30px}
label{display:block;margin:17px 0 7px}
input,select,textarea{
 width:100%;padding:13px;background:#292929;
 color:white;border:1px solid #555;
 border-radius:7px;font-size:16px
}
textarea{min-height:90px;resize:vertical}
button,.choice{
 display:block;width:100%;padding:15px;margin-top:17px;
 border:1px solid #b58b36;border-radius:8px;
 background:#292929;color:#fff;font-weight:bold;
 font-size:15px;cursor:pointer;text-align:center
}
.choice.active{background:#c49a45;color:#111}
#submitButton{
 background:#c49a45;color:#111;border:0
}
button:disabled{opacity:.6}
.hidden{display:none}
#message{margin-top:18px;text-align:center;line-height:1.6}
a{color:#d5ad58}
.links{text-align:center;margin-top:22px}
.small{font-size:13px;color:#aaa;line-height:1.5}
</style>
</head>

<body>
<div class="container">
 <h1>Next Level Grooming Lounge</h1>
 <p class="subtitle">Confidence Starts Here</p>

 <div class="card" id="bookingCard" style="visibility:hidden">
  <h2>Book Your Service</h2>
  <p class="small">Choose where you would like to receive your service.</p>

  <button type="button" class="choice active" id="loungeChoice">
   BOOK AT THE LOUNGE
  </button>

  <button type="button" class="choice" id="houseChoice">
   REQUEST A HOUSE CALL
  </button>

  <form id="bookingForm">

   <label for="category">Service category</label>
   <select id="category" required>
    <option value="">Choose a category</option>
    <option value="Barbering">Barbering</option>
    <option value="Hair salon">Hair salon</option>
    <option value="Nail services">Nail services</option>
   </select>

   <label for="service">Service required</label>
   <input id="service" type="text" required
    placeholder="e.g. Haircut, braiding, gel overlay">

   <label for="date">Preferred date</label>
   <input id="date" type="date" required>

   <label for="time">Preferred time</label>
   <input id="time" type="time" required>

   <div id="houseFields" class="hidden">
    <h2>House Call Details</h2>

    <label for="area">Your area / suburb</label>
    <input id="area" type="text"
     placeholder="e.g. Roodepoort or Soweto">

    <label for="address">House call address</label>
    <textarea id="address"
     placeholder="Enter your street address and any directions"></textarea>
   </div>

   <label for="notes">Additional instructions (optional)</label>
   <textarea id="notes"
    placeholder="Anything we should know before your appointment?"></textarea>

   <button type="submit" id="submitButton">
    SUBMIT BOOKING REQUEST
   </button>
  </form>

  <div id="message" role="status"></div>
 </div>

 <div class="links">
  <a href="account.html">Back to My Account</a>
  <br><br>
  <a href="index.html">Back to Home</a>
 </div>
</div>

<script>
const SUPABASE_URL = "https://teimbezoinfqlrxczafj.supabase.co";
const SUPABASE_KEY = "sb_publishable_3lJOm65rVFwElFqLN-Gxzw_LdYacHZP";

const db = window.supabase.createClient(
 SUPABASE_URL, SUPABASE_KEY
);

const params = new URLSearchParams(window.location.search);
const requestedType = params.get("type");

let bookingType = "In Lounge";

const loungeChoice = document.getElementById("loungeChoice");
const houseChoice = document.getElementById("houseChoice");
const houseFields = document.getElementById("houseFields");
const areaInput = document.getElementById("area");
const addressInput = document.getElementById("address");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");
const form = document.getElementById("bookingForm");
const bookingCard = document.getElementById("bookingCard");

// Remember the selected booking type when sending the customer to login.
function getBookingDestination(){
 const type = bookingType === "House Call" ? "housecall" : "shop";
 return "booking.html?type=" + type;
}

function redirectToLogin(){
 const destination = getBookingDestination();

 window.location.replace(
  "login.html?next=" + encodeURIComponent(destination)
 );
}

function chooseBookingType(type){
 bookingType = type;

 loungeChoice.classList.toggle("active", type === "In Lounge");
 houseChoice.classList.toggle("active", type === "House Call");

 const isHouseCall = type === "House Call";

 houseFields.classList.toggle("hidden", !isHouseCall);
 areaInput.required = isHouseCall;
 addressInput.required = isHouseCall;
}

loungeChoice.addEventListener("click", () =>
 chooseBookingType("In Lounge")
);

houseChoice.addEventListener("click", () =>
 chooseBookingType("House Call")
);

// Read the booking type selected on the homepage.
if(requestedType === "housecall"){
 chooseBookingType("House Call");
}else{
 chooseBookingType("In Lounge");
}

// Prevent customers from choosing a date in the past.
const today = new Date();

const localToday = [
 today.getFullYear(),
 String(today.getMonth()+1).padStart(2,"0"),
 String(today.getDate()).padStart(2,"0")
].join("-");

document.getElementById("date").min = localToday;

// Verify login before showing the booking form.
async function checkCustomer(){
 try{
  const {data,error} = await db.auth.getUser();

  if(error || !data.user){
   redirectToLogin();
   return;
  }

  bookingCard.style.visibility = "visible";

 }catch(error){
  message.textContent =
   "Unable to verify your login. Please try again.";

  bookingCard.style.visibility = "visible";
 }
}

form.addEventListener("submit", async function(event){
 event.preventDefault();
 message.textContent = "";

 submitButton.disabled = true;
 submitButton.textContent = "SUBMITTING REQUEST...";

 try{
  const {data:authData,error:authError} =
   await db.auth.getUser();

  if(authError) throw authError;

  if(!authData.user){
   redirectToLogin();
   return;
  }

  const category = document.getElementById("category").value;
  const service = document.getElementById("service").value.trim();
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const area = areaInput.value.trim();
  const address = addressInput.value.trim();
  const notes = document.getElementById("notes").value.trim();

  if(bookingType === "House Call" && (!area || !address)){
   throw new Error(
    "Please enter your area and house call address."
   );
  }

  const booking = {
   customer_id: authData.user.id,
   service_category: category,
   service_name: service,
   booking_type: bookingType,
   preferred_date: date,
   preferred_time: time,
   area: bookingType === "House Call" ? area : null,
   address: bookingType === "House Call" ? address : null,
   notes: notes || null
  };

  const {error} = await db
   .from("bookings")
   .insert([booking]);

  if(error) throw error;

  form.reset();
  chooseBookingType("In Lounge");

  message.textContent =
   "Your booking request has been submitted successfully! " +
   "It is PENDING until the lounge confirms your appointment. " +
   "Please check My Account for updates.";

 }catch(error){
  message.textContent = "Booking error: " + error.message;
 }finally{
  submitButton.disabled = false;
  submitButton.textContent = "SUBMIT BOOKING REQUEST";
 }
});

// Start the login check.
checkCustomer();
</script>
</body>
</html>
