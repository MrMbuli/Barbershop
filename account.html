
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Next Level Grooming Lounge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  background:#101010;color:white;
  font-family:Arial,sans-serif
}
.container{max-width:650px;margin:40px auto}
.header{text-align:center;margin-bottom:30px}
.header h1{color:#d5ad58}
.header p{color:#bbb}
.card{
  background:#1b1b1b;border:1px solid #b58b36;
  border-radius:12px;padding:25px;margin-bottom:20px
}
h2{color:#d5ad58}
.detail{padding:13px 0;border-bottom:1px solid #393939}
.detail:last-child{border:0}
.label{color:#aaa;font-size:13px;margin-bottom:6px}
.value{font-size:17px;overflow-wrap:anywhere}
button{
  width:100%;padding:14px;background:#c49a45;
  color:#111;border:0;border-radius:7px;
  font-weight:bold;font-size:16px;cursor:pointer
}
a{color:#d5ad58}
#message{text-align:center;color:#ddd;padding:15px}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Next Level Grooming Lounge</h1>
    <p>Confidence Starts Here</p>
  </div>

  <div class="card">
    <h2>My Customer Account</h2>
    <div id="message">Loading your account...</div>

    <div id="profile" hidden>
      <div class="detail">
        <div class="label">Full name</div>
        <div class="value" id="fullName"></div>
      </div>

      <div class="detail">
        <div class="label">Phone number</div>
        <div class="value" id="phone"></div>
      </div>

      <div class="detail">
        <div class="label">Email address</div>
        <div class="value" id="email"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Loyalty Rewards</h2>
    <p>Your loyalty points and rewards will appear here.</p>
  </div>

  <div class="card">
    <h2>My Bookings</h2>
    <p>Your appointment history will appear here.</p>
  </div>

  <button id="logoutButton" hidden>LOG OUT</button>

  <p style="text-align:center;margin-top:25px">
    <a href="index.html">Back to Home</a>
  </p>
</div>

<script>
const SUPABASE_URL = "https://teimbezoinfqlrxczafj.supabase.co";
const SUPABASE_KEY = "sb_publishable_3lJOm65rVFwElFqLN-Gxzw_LdYacHZP";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadAccount(){
  const message = document.getElementById("message");
  const profile = document.getElementById("profile");
  const logoutButton = document.getElementById("logoutButton");

  try {
    const {data: {user}, error: authError} =
      await supabaseClient.auth.getUser();

    if(authError) throw authError;

    if(!user){
      window.location.href = "login.html";
      return;
    }

    const {data, error} = await supabaseClient
      .from("customer_profiles")
      .select("full_name, phone")
      .eq("id", user.id)
      .single();

    if(error) throw error;

    document.getElementById("fullName").textContent =
      data.full_name || "Not provided";

    document.getElementById("phone").textContent =
      data.phone || "Not provided";

    document.getElementById("email").textContent =
      user.email || "Not available";

    message.textContent = "Welcome to your account!";
    profile.hidden = false;
    logoutButton.hidden = false;

  } catch(error) {
    message.textContent = "Unable to load your account: " + error.message;
  }
}

document.getElementById("logoutButton")
.addEventListener("click", async function(){
  const {error} = await supabaseClient.auth.signOut();

  if(error){
    document.getElementById("message").textContent = error.message;
    return;
  }

  window.location.href = "login.html";
});

loadAccount();
</script>
</body>
</html>
