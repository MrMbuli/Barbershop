
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Next Level Grooming Lounge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101010;color:white;font-family:Arial,sans-serif}
.container{max-width:850px;margin:25px auto}
header{text-align:center;margin-bottom:25px}
header h1{color:#d5ad58}
header p{color:#aaa}
.card{background:#1b1b1b;border:1px solid #b58b36;border-radius:12px;padding:20px;margin-bottom:18px}
h2,h3{color:#d5ad58}
p{color:#ddd;line-height:1.5;overflow-wrap:anywhere}
button{padding:13px;border:0;border-radius:7px;background:#c49a45;color:#111;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
button:hover{background:#e0b75f}
.whatsapp{background:#168b52;color:white}
.logout{background:#842d2d;color:white}
.booking{background:#252525;border:1px solid #444;border-radius:9px;padding:16px;margin-top:14px}
.status{display:inline-block;padding:6px 10px;background:#514321;color:#ffd477;border-radius:20px;font-size:12px}
.cancelled{background:#642c2c;color:#ffaaaa}
.completed{background:#23553a;color:#a9f0be}
.reason{border:1px solid #a34b4b;border-radius:8px;padding:14px;margin-top:14px;background:#301d1d}
.notice{color:#e9bd69;font-size:13px}
.message{text-align:center;color:#ccc;padding:15px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>NEXT LEVEL GROOMING LOUNGE</h1>
<p>MY CUSTOMER ACCOUNT</p>
<p>Confidence Starts Here.</p>
</header>

<div id="message" class="card message">Loading your account...</div>

<div id="account" hidden>
<div class="card">
<h2>My Profile</h2>
<p><strong>Name:</strong> <span id="customerName"></span></p>
<p><strong>Phone:</strong> <span id="customerPhone"></span></p>
<p><strong>Email:</strong> <span id="customerEmail"></span></p>
<button onclick="window.location.href='booking.html'">BOOK AN APPOINTMENT</button>
</div>

<div class="card">
<h2>My Appointments</h2>
<div id="bookingsList" class="message">Loading appointments...</div>
</div>

<div class="card">
<button id="logoutButton" class="logout">LOG OUT</button>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://teimbezoinfqlrxczafj.supabase.co";
const SUPABASE_KEY="sb_publishable_3lJOm65rVFwElFqLN-Gxzw_LdYacHZP";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const MANAGER_WHATSAPP="27635892769";
const HIDE_AFTER_MS=3*60*1000;

let currentUser=null;
let allBookings=[];

const message=document.getElementById("message");
const account=document.getElementById("account");
const bookingsList=document.getElementById("bookingsList");

function addText(parent,tag,value,className){
  const el=document.createElement(tag);
  el.textContent=value;
  if(className) el.className=className;
  parent.appendChild(el);
  return el;
}

function shouldShowBooking(booking){
  if(booking.status==="Completed"){
    if(!booking.status_updated_at) return true;
    const elapsed=Date.now()-new Date(booking.status_updated_at).getTime();
    return elapsed<HIDE_AFTER_MS;
  }

  if(booking.status==="Cancelled" && booking.cancellation_seen_at){
    return false;
  }

  return true;
}

function displayBookings(){
  bookingsList.replaceChildren();

  const visible=allBookings.filter(shouldShowBooking);

  if(visible.length===0){
    addText(bookingsList,"p","You currently have no visible appointments.");
    return;
  }

  visible.forEach(booking=>{
    const card=document.createElement("div");
    card.className="booking";

    addText(card,"h3",booking.service_name);
    addText(card,"p","Category: "+booking.service_category);
    addText(card,"p","Booking type: "+booking.booking_type);
    addText(card,"p","Date: "+booking.preferred_date);
    addText(card,"p","Time: "+booking.preferred_time);

    if(booking.booking_type==="House Call"){
      addText(card,"p","Area: "+(booking.area||"Not provided"));
      addText(card,"p","Address: "+(booking.address||"Not provided"));
    }

    if(booking.notes) addText(card,"p","Notes: "+booking.notes);

    let statusClass="status";
    if(booking.status==="Cancelled") statusClass+=" cancelled";
    if(booking.status==="Completed") statusClass+=" completed";

    addText(card,"span","Status: "+booking.status,statusClass);

    if(booking.status==="Cancelled"){
      const reasonBox=document.createElement("div");
      reasonBox.className="reason";

      addText(reasonBox,"h3","Appointment Cancelled");

      addText(reasonBox,"p",
        booking.cancellation_reason||
        "Management has cancelled this appointment. Please contact us for more information."
      );

      addText(reasonBox,"p",
        "If you have questions about this cancellation, please contact the manager."
      ,"notice");

      const contactButton=document.createElement("button");
      contactButton.className="whatsapp";
      contactButton.textContent="CONTACT MANAGER ON WHATSAPP";

      contactButton.addEventListener("click",()=>{
        const text="Hello Next Level Grooming Lounge. I have seen that my "+
          booking.service_name+" appointment on "+booking.preferred_date+
          " was cancelled. I would like more information about the reason.";
        window.open(
          "https://wa.me/"+MANAGER_WHATSAPP+"?text="+encodeURIComponent(text),
          "_blank"
        );
      });

      reasonBox.appendChild(contactButton);

      const acknowledgeButton=document.createElement("button");
      acknowledgeButton.textContent="I UNDERSTAND — DISMISS";

      acknowledgeButton.addEventListener("click",async()=>{
        if(!confirm("Have you read the cancellation reason? This will remove the appointment from your booking history.")){
          return;
        }

        acknowledgeButton.disabled=true;
        acknowledgeButton.textContent="SAVING...";

        const {error}=await supabaseClient
          .from("bookings")
          .update({cancellation_seen_at:new Date().toISOString()})
          .eq("id",booking.id)
          .eq("customer_id",currentUser.id)
          .eq("status","Cancelled");

        if(error){
          alert("Unable to acknowledge cancellation: "+error.message);
          acknowledgeButton.disabled=false;
          acknowledgeButton.textContent="I UNDERSTAND — DISMISS";
          return;
        }

        allBookings=allBookings.filter(item=>item.id!==booking.id);
        displayBookings();
      });

      reasonBox.appendChild(acknowledgeButton);
      card.appendChild(reasonBox);
    }

    bookingsList.appendChild(card);
  });
}

async function loadBookings(){
  bookingsList.textContent="Loading appointments...";

  const {data,error}=await supabaseClient
    .from("bookings")
    .select("*")
    .eq("customer_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    bookingsList.textContent="Unable to load appointments: "+error.message;
    return;
  }

  allBookings=data||[];
  displayBookings();
}

async function loadAccount(){
  try{
    const {data:{user},error}=await supabaseClient.auth.getUser();

    if(error) throw error;

    if(!user){
      window.location.href="login.html";
      return;
    }

    currentUser=user;

    const {data:profile, error:profileError}=await supabaseClient
      .from("customer_profiles")
      .select("full_name,phone")
      .eq("id",user.id)
      .maybeSingle();

    if(profileError) throw profileError;

    document.getElementById("customerName").textContent=profile?.full_name||"Not provided";
    document.getElementById("customerPhone").textContent=profile?.phone||"Not provided";
    document.getElementById("customerEmail").textContent=user.email||"Not provided";

    message.hidden=true;
    account.hidden=false;

    await loadBookings();

  }catch(error){
    console.error(error);
    message.textContent="Unable to load your account: "+error.message;
  }
}

document.getElementById("logoutButton").addEventListener("click",async()=>{
  const {error}=await supabaseClient.auth.signOut();
  if(error){alert(error.message);return;}
  window.location.href="login.html";
});

// Refresh booking visibility every five seconds.
setInterval(()=>{
  if(currentUser) displayBookings();
},5000);

// Refresh data when the customer returns to this page.
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && currentUser) loadBookings();
});

loadAccount();
</script>
</body>
</html>
