
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">

<title>Reset Password | Next Level Grooming Lounge</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --gold:#d8b45c;
 --green:#69c58a;
 --red:#ff7777;
}

body{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px 16px;
 background:radial-gradient(ellipse at top,#292216,transparent 45%),#101010;
 color:white;
 font-family:Arial,sans-serif;
}

.container{
 width:100%;
 max-width:440px;
 animation:appear .5s ease;
}

@keyframes appear{
 from{opacity:0;transform:translateY(18px)}
 to{opacity:1;transform:translateY(0)}
}

.card{
 padding:30px 25px;
 background:linear-gradient(145deg,#202020,#151515);
 border:1px solid rgba(216,180,92,.4);
 border-radius:20px;
 box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.brand{text-align:center;margin-bottom:30px}

.brand-icon{
 width:58px;height:58px;
 margin:0 auto 13px;
 display:flex;align-items:center;justify-content:center;
 border-radius:18px;
 background:linear-gradient(145deg,#e6c77e,#a77b2d);
 color:#151515;font-size:27px;
}

.brand h1{
 color:var(--gold);
 font-size:23px;
 letter-spacing:1.2px;
}

.brand p{
 color:#aaa;font-size:11px;
 letter-spacing:3px;margin-top:6px;
}

.icon{
 width:65px;height:65px;
 margin:0 auto 20px;
 display:flex;align-items:center;justify-content:center;
 border-radius:50%;
 background:#302819;
 border:1px solid #735b30;
 color:var(--gold);
 font-size:28px;
}

h2{text-align:center;font-size:25px;margin-bottom:10px}

.description{
 text-align:center;
 color:#aaa;
 font-size:13px;
 line-height:1.7;
 margin-bottom:27px;
}

.field{margin-bottom:19px}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:9px;
}

.input-wrap{position:relative}

input{
 width:100%;
 height:51px;
 padding:0 50px 0 14px;
 background:#242424;
 color:white;
 border:1px solid #444;
 border-radius:10px;
 font-size:15px;
}

input:focus{
 outline:none;
 border-color:var(--gold);
 box-shadow:0 0 0 3px rgba(216,180,92,.09);
}

.toggle{
 position:absolute;
 right:10px;
 top:50%;
 transform:translateY(-50%);
 border:0;
 background:none;
 color:#aaa;
 font-size:17px;
 padding:7px;
 cursor:pointer;
}

.meter{
 display:flex;
 gap:5px;
 margin-top:10px;
}

.meter span{
 height:4px;
 flex:1;
 border-radius:10px;
 background:#383838;
 transition:.2s;
}

.hint{
 margin-top:7px;
 color:#888;
 font-size:11px;
}

button.submit{
 width:100%;
 min-height:51px;
 margin-top:8px;
 border:0;
 border-radius:10px;
 background:linear-gradient(110deg,#a77b2d,#e2c477,#b88a38);
 color:#151515;
 font-weight:bold;
 font-size:14px;
 letter-spacing:1px;
 cursor:pointer;
}

button:disabled{opacity:.6;cursor:not-allowed}

#message{
 margin-top:18px;
 text-align:center;
 font-size:13px;
 line-height:1.7;
 overflow-wrap:anywhere;
}

.error{color:var(--red)}
.success{color:var(--green)}
.normal{color:#aaa}

.spinner{
 display:inline-block;
 width:15px;height:15px;
 border:2px solid rgba(0,0,0,.2);
 border-top-color:#111;
 border-radius:50%;
 animation:spin .7s linear infinite;
 vertical-align:middle;
 margin-right:8px;
}

@keyframes spin{to{transform:rotate(360deg)}}

#complete{
 display:none;
 text-align:center;
}

.success-icon{
 width:70px;height:70px;
 margin:0 auto 20px;
 border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:#193022;
 border:1px solid #4c9a65;
 color:#8ee4a4;
 font-size:34px;
}

#complete p{
 color:#bbb;
 font-size:13px;
 line-height:1.8;
 margin:14px 0 23px;
}

.login-link{
 display:block;
 padding:15px;
 border-radius:10px;
 background:linear-gradient(110deg,#a77b2d,#e2c477);
 color:#111;
 font-weight:bold;
 font-size:13px;
 text-decoration:none;
}

.footer{
 text-align:center;
 margin-top:25px;
 font-size:13px;
 line-height:2.2;
}

a{color:var(--gold);text-decoration:none}

@media(max-width:420px){
 .card{padding:26px 19px}
}
</style>
</head>

<body>

<div class="container">

<div class="card">

 <div class="brand">
  <div class="brand-icon">✂</div>
  <h1>NEXT LEVEL</h1>
  <p>GROOMING LOUNGE</p>
 </div>


 <div id="resetSection">

  <div class="icon">🔐</div>

  <h2>Create new password</h2>

  <p class="description">
   Choose a new password for your
   Next Level customer account.
  </p>

  <form id="resetForm">

   <div class="field">

    <label for="newPassword">New password</label>

    <div class="input-wrap">

     <input
      id="newPassword"
      type="password"
      minlength="8"
      required
      autocomplete="new-password"
      placeholder="At least 8 characters"
     >

     <button
      type="button"
      class="toggle"
      data-target="newPassword"
      aria-label="Show new password"
     >◉</button>

    </div>

    <div class="meter">
     <span id="m1"></span>
     <span id="m2"></span>
     <span id="m3"></span>
     <span id="m4"></span>
    </div>

    <p id="strength" class="hint">
     Use at least 8 characters.
    </p>

   </div>


   <div class="field">

    <label for="confirmPassword">Confirm new password</label>

    <div class="input-wrap">

     <input
      id="confirmPassword"
      type="password"
      required
      autocomplete="new-password"
      placeholder="Enter your new password again"
     >

     <button
      type="button"
      class="toggle"
      data-target="confirmPassword"
      aria-label="Show confirmation password"
     >◉</button>

    </div>

   </div>


   <button id="saveButton" class="submit" type="submit">
    SAVE NEW PASSWORD
   </button>

  </form>

  <div id="message" role="status" aria-live="polite"></div>

 </div>


 <div id="complete">

  <div class="success-icon">✓</div>

  <h2 style="color:#d8b45c">Password updated!</h2>

  <p>
   Your password has been changed successfully.
   You can now log in using your new password.
  </p>

  <a href="login.html" class="login-link">
   CONTINUE TO LOGIN →
  </a>

 </div>


 <div class="footer">
  <a href="index.html">← Back to home</a>
 </div>

</div>

</div>

<script>

// =====================================
// SUPABASE CONNECTION
// =====================================

const SUPABASE_URL =
 "https://teimbezoinfqlrxczafj.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_3lJOm65rVFwElFqLN-Gxzw_LdYacHZP";

const supabaseClient = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const form = document.getElementById("resetForm");
const button = document.getElementById("saveButton");
const message = document.getElementById("message");

let recoveryReady = false;


// =====================================
// MESSAGE
// =====================================

function showMessage(text,type="normal"){
 message.textContent = text;
 message.className = type;
}


// =====================================
// PASSWORD VISIBILITY
// =====================================

document.querySelectorAll(".toggle").forEach(function(toggle){

 toggle.addEventListener("click",function(){

  const input =
   document.getElementById(this.dataset.target);

  const visible = input.type === "password";

  input.type = visible ? "text" : "password";

  this.textContent = visible ? "◎" : "◉";

  this.setAttribute(
   "aria-label",
   visible ? "Hide password" : "Show password"
  );

 });

});


// =====================================
// PASSWORD STRENGTH
// =====================================

const newPassword =
 document.getElementById("newPassword");

newPassword.addEventListener("input",function(){

 const value = this.value;

 let score = 0;

 if(value.length >= 8) score++;
 if(/[A-Z]/.test(value)) score++;
 if(/[0-9]/.test(value)) score++;
 if(/[^A-Za-z0-9]/.test(value)) score++;

 const meters = [
  document.getElementById("m1"),
  document.getElementById("m2"),
  document.getElementById("m3"),
  document.getElementById("m4")
 ];

 const colors = [
  "#e05b5b",
  "#e0a34f",
  "#d8c15c",
  "#69c58a"
 ];

 meters.forEach((meter,index)=>{

  meter.style.background =
   index < score ? colors[score-1] : "#383838";

 });

 const messages = [
  "Use at least 8 characters.",
  "Weak password.",
  "Fair password.",
  "Good password.",
  "Strong password."
 ];

 const strength =
  document.getElementById("strength");

 strength.textContent = messages[score];

 strength.style.color =
  score >= 3 ? "#69c58a" : "#aaa";

});


// =====================================
// CHECK RECOVERY SESSION
// =====================================

async function initialiseRecovery(){

 const params = new URLSearchParams(
  window.location.search
 );

 // Supabase may return a recovery access token
 // in the URL hash on older/implicit flow links.

 const hashParams = new URLSearchParams(
  window.location.hash.replace(/^#/,"")
 );

 const errorDescription =
  hashParams.get("error_description") ||
  params.get("error_description");

 if(errorDescription){

  showMessage(
   "This password reset link is invalid or expired. Please request a new one.",
   "error"
  );

  button.disabled = true;

  return;

 }

 const accessToken = hashParams.get("access_token");
 const refreshToken = hashParams.get("refresh_token");
 const tokenType = hashParams.get("type");

 try{

  // Support links returning tokens in the URL hash.

  if(
   tokenType === "recovery" &&
   accessToken &&
   refreshToken
  ){

   const {error} =
    await supabaseClient.auth.setSession({
     access_token:accessToken,
     refresh_token:refreshToken
    });

   if(error) throw error;

  }


  // Also support Supabase's PKCE recovery flow,
  // which exchanges the URL code for a session.

  else if(params.has("code")){

   const {error} =
    await supabaseClient.auth.exchangeCodeForSession(
     params.get("code")
    );

   if(error) throw error;

  }


  const {data,error} =
   await supabaseClient.auth.getSession();

  if(error) throw error;

  if(!data.session){

   throw new Error(
    "Your reset link is invalid or has expired. Please request a new one."
   );

  }

  recoveryReady = true;

  // Remove recovery credentials from the visible address.
  // The session remains stored by Supabase.

  window.history.replaceState(
   {},
   document.title,
   window.location.pathname
  );

  showMessage(
   "Reset link verified. You can create your new password.",
   "success"
  );

 }catch(error){

  console.error("Recovery session error:",error);

  recoveryReady = false;

  button.disabled = true;

  showMessage(
   error.message ||
   "Your reset link is invalid or has expired. Please request a new one.",
   "error"
  );

 }

}


// =====================================
// SAVE NEW PASSWORD
// =====================================

form.addEventListener("submit",async function(event){

 event.preventDefault();

 if(!recoveryReady){

  showMessage(
   "Please open a valid password reset link from your email.",
   "error"
  );

  return;

 }

 const password =
  document.getElementById("newPassword").value;

 const confirmation =
  document.getElementById("confirmPassword").value;


 if(password.length < 8){

  showMessage(
   "Your password must contain at least 8 characters.",
   "error"
  );

  return;

 }


 if(password !== confirmation){

  showMessage(
   "Your passwords do not match.",
   "error"
  );

  return;

 }


 button.disabled = true;

 button.innerHTML =
  '<span class="spinner"></span> UPDATING PASSWORD...';

 showMessage(
  "Please wait while we update your password.",
  "normal"
 );


 try{

  const {error} =
   await supabaseClient.auth.updateUser({

    password:password

   });

  if(error) throw error;


  document.getElementById("resetSection")
   .style.display = "none";

  document.getElementById("complete")
   .style.display = "block";


  // Sign out after changing the password so the
  // customer signs in using their new credentials.

  await supabaseClient.auth.signOut();


 }catch(error){

  console.error("Password update error:",error);

  showMessage(
   error.message || "Unable to update your password.",
   "error"
  );

  button.disabled = false;

  button.textContent = "SAVE NEW PASSWORD";

 }

});


// Start recovery verification

initialiseRecovery();

</script>

</body>
</html>
