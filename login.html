
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login | Next Level Grooming Lounge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:flex;align-items:center;justify-content:center;
  background:#101010;color:white;font-family:Arial,sans-serif
}
.container{
  width:100%;max-width:430px;padding:30px;
  background:#1b1b1b;border:1px solid #b58b36;
  border-radius:14px
}
h1{text-align:center;color:#d5ad58;font-size:25px}
.subtitle{text-align:center;color:#bbb}
h2{margin-top:30px}
label{display:block;margin:16px 0 7px}
input{
  width:100%;padding:13px;background:#292929;
  color:white;border:1px solid #555;border-radius:7px;
  font-size:16px
}
button{
  width:100%;padding:14px;margin-top:22px;
  background:#c49a45;color:#111;border:0;
  border-radius:7px;font-size:16px;
  font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
a{color:#d5ad58}
.links{text-align:center;margin-top:22px;line-height:2}
#message{text-align:center;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="container">
  <h1>Next Level Grooming Lounge</h1>
  <p class="subtitle">Confidence Starts Here</p>

  <h2>Customer Login</h2>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" required
      autocomplete="email" placeholder="Your email">

    <label for="password">Password</label>
    <input id="password" type="password" required
      autocomplete="current-password" placeholder="Your password">

    <button id="loginButton" type="submit">LOG IN</button>
  </form>

  <div id="message" role="status"></div>

  <div class="links">
    <a href="register.html">Create an account</a>
    <br>
    <a href="index.html">Back to Home</a>
  </div>
</div>

<script>
const SUPABASE_URL = "https://teimbezoinfqlrxczafj.supabase.co";
const SUPABASE_KEY = "sb_publishable_3lJOm65rVFwElFqLN-Gxzw_LdYacHZP";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "LOGGING IN...";
  message.textContent = "";

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    message.textContent = "Login successful! Opening your account...";

    window.location.href = "account.html";

  } catch (error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = "LOG IN";
  }
});
</script>
</body>
</html>
